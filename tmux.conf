# tmux config for p. Copy to ~/.tmux.conf or source it from there.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -sg escape-time 10              # fast Esc matters for claude
set -g focus-events on

# Windows numbered from 1, no gaps after closing one
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# The window name is the manifest key — tmux must not overwrite it
setw -g automatic-rename off
set -g allow-rename off

bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display "config reloaded"

# Status line: [session] | windows | keys
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bg=colour31,fg=colour255,bold] #S #[default] "
set -g status-left-length 30
# claude state glyph (agent-status from hooks): ◐ working  ! waiting for you  ✓ done
setw -g window-status-format " #I:#W#{?@agent, #{?#{==:#{@agent},!},#[fg=colour196#,bold]!,#{@agent}},}#[default] "
setw -g window-status-current-format "#[bg=colour214,fg=colour232,bold] #I:#W#{?@agent, #{?#{==:#{@agent},!},#[fg=colour196#,bold]!,#{@agent}},}#[bg=colour214,fg=colour232] "
setw -g monitor-activity on
setw -g window-status-activity-style "fg=colour214"

# ── Function keys, no prefix ──
bind -n F1 display-popup -E -w 70% -h 60% "~/bin/p"
bind -n F2 command-prompt -p "New Claude window:" "new-window -c '#{pane_current_path}' -n '%%' '~/bin/p claude; exec bash'"
bind -n F3 previous-window
bind -n F4 next-window
bind -n F5 command-prompt -I "#W" -p "Rename:" "run-shell \"~/bin/p rename '#{window_id}' '%%'\""
bind -n F6 detach-client
bind -n F7 display-popup -E -w 70% -h 60% "~/bin/p help"
bind -n F8 command-prompt -p "New shell window:" "new-window -c '#{pane_current_path}' -n '%%'"

# "! waiting: …" — claude in other windows/projects is waiting for you (p waiting)
set -g status-interval 3
set -g status-right "#(~/bin/p waiting #{window_id})#[fg=colour245]F1 projects  F2 claude  F8 shell  F3/F4 prev/next  F5 rename  F6 detach  #[fg=colour214]F7 help "
set -g status-right-length 200

# Auto-restore: as soon as the tmux server starts again (crash, reboot), bring
# back every window and session from the p manifest. @p_restored lives until
# the server dies, so reloading the config does not repeat it.
if -F '#{!=:#{@p_restored},1}' 'set -g @p_restored 1 ; run-shell -b "~/bin/p restore >/dev/null 2>&1"'
