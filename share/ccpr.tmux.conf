# ccpr — tmux integration. Sourced from ~/.tmux.conf:
#   source-file ~/.config/ccpr/ccpr.tmux.conf

# The window name is the manifest key: tmux must never rename windows itself.
setw -g automatic-rename off
set  -g allow-rename off

# Windows numbered from 1, no gaps after closing one.
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# Fast Esc and focus events: Claude Code's TUI relies on both.
set -sg escape-time 10
set  -g focus-events on

# Agent state glyph (set by Claude Code hooks via `ccpr status`):
#   ◐ working   ! waiting for you (red)   ✓ answered
setw -g window-status-format " #I:#W#{?@agent, #{?#{==:#{@agent},!},#[fg=colour196#,bold]!,#{@agent}},}#[default] "
setw -g window-status-current-format "#[bg=colour214,fg=colour232,bold] #I:#W#{?@agent, #{?#{==:#{@agent},!},#[fg=colour196#,bold]!,#{@agent}},}#[bg=colour214,fg=colour232] "

# Function keys, no prefix needed.
bind -n F1 display-popup -E -w 70% -h 60% "@BIN@/ccpr"
bind -n F2 command-prompt -p "New Claude window:" "new-window -c '#{pane_current_path}' -n '%%' '@BIN@/ccpr claude; exec \"$SHELL\"'"
bind -n F3 previous-window
bind -n F4 next-window
bind -n F5 command-prompt -I "#W" -p "Rename:" "run-shell \"@BIN@/ccpr rename '#{window_id}' '%%'\""
bind -n F6 detach-client
bind -n F7 display-popup -E -w 70% -h 60% "@BIN@/ccpr help"

# "! waiting: project/window …" — agents in other windows that need you.
set -g status-interval 3
set -g status-right "#(@BIN@/ccpr waiting #{window_id})#[fg=colour245]F1 projects  F2 new  F3/F4 prev/next  F5 rename  F6 detach  #[fg=colour214]F7 help "
set -g status-right-length 200

# Auto-restore once per server lifetime: after a crash or reboot the first
# server start brings every saved window back; reloading the config does not.
if -F '#{!=:#{@ccpr_restored},1}' 'set -g @ccpr_restored 1 ; run-shell -b "@BIN@/ccpr restore >/dev/null 2>&1"'
