<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-labelledby="title">
  <title id="title">ccpr — Claude Code Projects</title>
  <defs>
    <clipPath id="frame"><rect width="800" height="220" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">
    <rect width="800" height="220" fill="#1c1c1c"/>

    <!-- terminal title bar -->
    <rect width="800" height="30" fill="#262626"/>
    <circle cx="22" cy="15" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="15" r="6" fill="#febc2e"/>
    <circle cx="62" cy="15" r="6" fill="#28c840"/>

    <!-- wordmark with a block cursor -->
    <text x="40" y="112" font-size="68" font-weight="700" fill="#f2f2f2" letter-spacing="2">ccpr</text>
    <rect x="216" y="62" width="36" height="58" fill="#ffaf00"/>
    <text x="42" y="148" font-size="19" fill="#9e9e9e">Claude Code sessions that survive tmux</text>

    <!-- tmux status line, as ccpr draws it: project, tasks with agent state, keys -->
    <rect y="180" width="800" height="40" fill="#303030"/>
    <rect y="180" width="84" height="40" fill="#0087af"/>
    <g font-size="16">
      <text x="18" y="206" font-weight="700" fill="#ffffff">home</text>
      <text x="100" y="206" fill="#bcbcbc">1:api <tspan fill="#e4e4e4">◐</tspan></text>
      <text x="196" y="206" fill="#bcbcbc">2:docs <tspan fill="#ff3b30" font-weight="700">!</tspan></text>
      <rect x="296" y="180" width="104" height="40" fill="#ffaf00"/>
      <text x="310" y="206" font-weight="700" fill="#080808">3:site ✓</text>
      <text x="780" y="206" text-anchor="end" fill="#8a8a8a" xml:space="preserve">F1 projects  F2 new</text>
    </g>
  </g>
</svg>
